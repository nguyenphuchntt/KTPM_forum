version: '3.8'
services:
  app:
    build: .
    ports:
        - "8080:8080"
    environment:
      - DB_DRIVER=mysql
      - DB_SOURCE=user:password@tcp(db:3306)/forum_db?parseTime=true
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: forum_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
    db_data: