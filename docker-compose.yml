services:
  app:
    build: .
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      - DB_DRIVER=mysql
      - DB_SOURCE=user:password@tcp(db:3306)/forum_db?parseTime=true
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=forum_db
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - BASE_PATH=/app/
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING}
      - AZURE_QUARANTINE_CONTAINER=${AZURE_QUARANTINE_CONTAINER:-quarantine-container}
      - AZURE_PRODUCTION_CONTAINER=${AZURE_PRODUCTION_CONTAINER:-post-images}
      - GLOBAL_RPS=${GLOBAL_RPS}
      - GLOBAL_BURST=${GLOBAL_BURST}
      - USER_RPM=${USER_RPM}
      - IP_RPM=${IP_RPM}
      - LOGIN_ATTEMPTS=${LOGIN_ATTEMPTS}
      - LOGIN_WINDOW_MINUTES=${LOGIN_WINDOW_MINUTES}
      - REGISTER_ATTEMPTS=${REGISTER_ATTEMPTS}
      - REGISTER_WINDOW_MINUTES=${REGISTER_WINDOW_MINUTES}
      - POSTS_PER_HOUR=${POSTS_PER_HOUR}
      - COMMENTS_PER_HOUR=${COMMENTS_PER_HOUR}
      - REACTIONS_PER_MINUTE=${REACTIONS_PER_MINUTE}
      - UPLOAD_REQUESTS_PER_MINUTE=${UPLOAD_REQUESTS_PER_MINUTE}
      - ENABLE_QUARANTINE_WATCHER=true
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: forum_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306" # Map to host port 3307 instead
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  db_data:
  prometheus_data:
  grafana_data:
