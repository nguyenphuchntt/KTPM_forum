version: '3.8'
services:
  app:
    build: .
    ports:
        - "8080:8080"
    environment:
      - DB_DRIVER=mysql
      - DB_SOURCE=user:password@tcp(db:3306)/forum_db?parseTime=true
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=forum_db
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: forum_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
        interval: 3s
        timeout: 2s
        retries: 10
        start_period: 5s

volumes:
    db_data: