services:
  app:
    build: .
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 2G
        reservations:
          cpus: "2.0"
          memory: 1G
    environment:
      - DB_DRIVER=postgres
      - DB_SOURCE=postgres://user:password@db:5432/forum_db?sslmode=disable
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=forum_db
      - DB_SSLMODE=disable
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - BASE_PATH=/app/
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING}
      - AZURE_QUARANTINE_CONTAINER=${AZURE_QUARANTINE_CONTAINER:-quarantine-container}
      - AZURE_PRODUCTION_CONTAINER=${AZURE_PRODUCTION_CONTAINER:-post-images}
      - GLOBAL_RPS=${GLOBAL_RPS}
      - GLOBAL_BURST=${GLOBAL_BURST}
      - USER_RPM=${USER_RPM}
      - IP_RPM=${IP_RPM}
      - LOGIN_ATTEMPTS=${LOGIN_ATTEMPTS}
      - LOGIN_WINDOW_MINUTES=${LOGIN_WINDOW_MINUTES}
      - REGISTER_ATTEMPTS=${REGISTER_ATTEMPTS}
      - REGISTER_WINDOW_MINUTES=${REGISTER_WINDOW_MINUTES}
      - POSTS_PER_HOUR=${POSTS_PER_HOUR}
      - COMMENTS_PER_HOUR=${COMMENTS_PER_HOUR}
      - REACTIONS_PER_MINUTE=${REACTIONS_PER_MINUTE}
      - UPLOAD_REQUESTS_PER_MINUTE=${UPLOAD_REQUESTS_PER_MINUTE}
      - ENABLE_QUARANTINE_WATCHER=true
      - GOMAXPROCS=4
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  db:
    image: postgres:16-alpine
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G
        reservations:
          cpus: "1.0"
          memory: 2G
    environment:
      POSTGRES_DB: forum_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432" # Map to host port 5433 to avoid clashing with a local Postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d forum_db"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s

volumes:
  db_data:
