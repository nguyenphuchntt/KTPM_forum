<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/css/app.css">
    <link rel="stylesheet" href="/assets/css/navbar.css">
    <link rel="stylesheet" href="/assets/css/login.css">
    <link rel="stylesheet" href="/assets/css/post.css">
    <link rel="stylesheet" href="/assets/css/error.css">
    <link rel="shortcut icon" href="/assets/images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <header>
        <a href="/">
            <p>
                <img class="img-01" src="/assets/images/01.png" alt="01">
                <span class="forum-title">forum</span>
            </p>
        </a>
        <!-- Sits between the logo and the user controls: header is a flex row
        with space-between, so this third child lands in the middle. -->
        <div class="header-search">
            <i class="fa-solid fa-magnifying-glass header-search-icon"></i>
            <input type="search" id="navbar-search" class="header-search-input" placeholder="Search posts..."
                autocomplete="off" aria-label="Search posts" role="combobox" aria-expanded="false"
                aria-controls="search-suggestions" aria-autocomplete="list">
            <div class="search-suggestions" id="search-suggestions" role="listbox"
                aria-label="Search suggestions" hidden></div>
        </div>
        {{ if .IsAuthenticated}}
        <div class="header-user">
            <span class="header-username"><i class="fa-regular fa-user"></i>{{.UserName}}</span>
            <a href="/logout" class="logout-link">
                <i class="fa-solid fa-right-from-bracket"></i>
            </a>
        </div>
        {{else}}
        <a href="/login" class="login-link">Log in
            <i class="fa-solid fa-right-to-bracket"></i>
        </a>
        {{end}}
    </header>
